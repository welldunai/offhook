[project]
name = "offhook"
version = "0.1.0"
description = "Open-source, self-hostable API for AI phone calls (STT + LLM + TTS over real phone numbers), orchestrated by Pipecat."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.117.1",
    "uvicorn>=0.35.0",
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.1",
    # Multi-tenant foundation: Postgres persistence + envelope encryption + auth.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=42",
    "argon2-cffi>=23",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",
    # Providers: Cartesia TTS, Deepgram STT, OpenAI-compatible LLMs, Plivo
    # telephony, Silero VAD, SmallWebRTC.
    # Pinned: newer pipecat pulls numba/llvmlite versions that
    # have no prebuilt macOS wheel and fail to compile without LLVM installed.
    "pipecat-ai[cartesia,deepgram,openai,runner,silero,webrtc]==0.0.101",
    # Pipecat's prebuilt playground UI served at /client for local testing.
    "pipecat-ai-small-webrtc-prebuilt==2.5.0",
    # Smart Turn v3's audio features (end-of-turn detection, app/pipeline.py).
    # Only the feature extractor is used, so PyTorch is not needed.
    "transformers>=4.48",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
