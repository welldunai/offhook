# Deploys hosted Offhook to Cloudflare Containers (CLOUDFLARE.md) from GitHub's
# runners: native linux/amd64 builds and a fast connection for the image upload.
# Started by hand for now (Actions → Deploy to Cloudflare → Run workflow).
name: Deploy to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4
      # Migrations first, so the database schema is ready before the new code is.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Migrate the database
        working-directory: .
        run: |
          python deploy/cloudflare/requirements.py pyproject.toml > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt && pip install --no-deps -e .
          alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build the image and deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 884ea67f0f6b2d08d50d15332fbacb09
