# The live demo's public API (DEMO.md). Free plan.
name = "offhook-demo"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://offhook.welldun.ai,http://localhost:4321,http://localhost:4370"
PLANNER_MODEL = "openai/gpt-oss-120b"
DAILY_PLANS_PER_VISITOR = "10"
DAILY_CALLS_PER_VISITOR = "3"
MAX_CALL_SECONDS = "120"
MAX_CONCURRENT = "5"
DAILY_MINUTES_CAP = "300"
# The voice server, through the Cloudflare Tunnel in production.
VOICE_URL = "http://localhost:8765"

# Secrets (wrangler secret put; .dev.vars locally):
#   GROQ_API_KEY, TURNSTILE_SECRET_KEY, VISITOR_HASH_SALT, DEMO_HMAC_SECRET (shared with the voice server)

# The Gate: one instance holds every limit, so counts can't race.
[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate"]

# Sessions and the waitlist. The real database_id is filled in at deploy (milestone 4);
# local dev (wrangler dev) uses a local database and ignores it.
[[d1_databases]]
binding = "DB"
database_name = "offhook-demo"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Hourly: delete day-old sessions and free stale lines.
[triggers]
crons = ["0 * * * *"]
